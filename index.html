<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국사2 자기주도학습 | 이솔고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Gowun+Batang&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #ECE4D3;
    --paper-2: #E2D8C1;
    --paper-3: #DDD0B4;
    --ink: #241F19;
    --ink-soft: #4A4136;
    --muted: #8B8172;
    --seal: #9C2B27;
    --seal-dark: #6E1D1B;
    --seal-soft: #C65B4A;
    --indigo: #2F4256;
    --indigo-soft: #5A7188;
    --gold: #A9823D;
    --correct: #35603F;
    --incorrect: #9C2B27;
    --shadow: 0 2px 0 rgba(36,31,25,0.08);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.35), transparent 60%),
      radial-gradient(ellipse at 100% 100%, rgba(0,0,0,0.05), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    line-height:1.6;
  }

  /* subtle paper grain */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, transparent 1px, transparent 2px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.012) 0px, transparent 1px, transparent 2px);
    z-index:0;
  }

  .app{
    position:relative;
    z-index:1;
    max-width:760px;
    margin:0 auto;
    padding:28px 18px 80px;
  }

  /* ---------- Header ---------- */
  .masthead{
    text-align:center;
    padding:6px 0 22px;
    border-bottom:3px double var(--ink);
    margin-bottom:22px;
  }
  .masthead .school{
    font-family:'Noto Serif KR', serif;
    font-size:13px;
    letter-spacing:4px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .masthead h1{
    font-family:'Gowun Batang', 'Noto Serif KR', serif;
    font-size:30px;
    margin:0 0 8px;
    font-weight:700;
    color:var(--ink);
  }
  .masthead .sub{
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .masthead .sub b{ color:var(--seal); font-weight:600; }

  /* ---------- Folder Tabs ---------- */
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:0;
    padding-left:4px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:13px 6px 12px;
    font-family:'Noto Serif KR', serif;
    font-size:14.5px;
    font-weight:600;
    color:var(--muted);
    background:var(--paper-2);
    border:1px solid rgba(36,31,25,0.18);
    border-bottom:none;
    border-radius:10px 10px 0 0;
    cursor:pointer;
    position:relative;
    top:2px;
    transition:background .15s ease, color .15s ease, top .15s ease;
    user-select:none;
  }
  .tab.active{
    background:var(--paper);
    color:var(--ink);
    top:0;
    box-shadow: 0 -2px 0 rgba(0,0,0,0.02) inset;
    border-color: var(--ink);
    border-bottom:1px solid var(--paper);
  }
  .tab .num{
    display:inline-block;
    color:var(--seal);
    margin-right:4px;
  }
  .tab.disabled{
    cursor:not-allowed;
    opacity:0.55;
  }
  .tab .tag{
    display:block;
    font-family:'Noto Sans KR', sans-serif;
    font-size:9.5px;
    font-weight:500;
    color:var(--muted);
    margin-top:3px;
    letter-spacing:0.5px;
  }

  .panel{
    background:var(--paper);
    border:1px solid var(--ink);
    border-top:none;
    border-radius:0 0 12px 12px;
    padding:26px 22px 30px;
    min-height:420px;
  }

  /* ---------- Coming soon ---------- */
  .soon{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
  }
  .soon .stamp-mini{
    width:74px;height:74px;
    border:3px solid var(--seal-soft);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--seal-soft);
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:13px;
    transform:rotate(-8deg);
    margin-bottom:18px;
    opacity:0.7;
  }
  .soon h3{
    font-family:'Noto Serif KR', serif;
    color:var(--ink-soft);
    margin:0 0 6px;
  }

  /* ---------- Section headers in TOC ---------- */
  .unit-head{
    font-family:'Noto Serif KR', serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--indigo);
    margin:26px 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid rgba(47,66,86,0.25);
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .unit-head:first-child{ margin-top:0; }
  .unit-head .n{
    font-family:'Noto Serif KR', serif;
    font-size:13.5px;
    color:var(--indigo-soft);
  }

  .toc-summary{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--paper-2);
    border:1px solid rgba(36,31,25,0.15);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:22px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .toc-summary .big{
    font-family:'Noto Serif KR', serif;
    font-size:20px;
    color:var(--seal);
    font-weight:700;
  }

  .topic-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 10px;
    border-bottom:1px solid rgba(36,31,25,0.12);
    cursor:pointer;
    transition:background .12s ease;
    border-radius:8px;
  }
  .topic-item:hover{ background:rgba(156,43,39,0.06); }
  .topic-item .idx{
    font-family:'Noto Serif KR', serif;
    font-size:12px;
    color:var(--muted);
    min-width:52px;
  }
  .topic-item .info{ flex:1; min-width:0; }
  .topic-item .info .t{
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    margin-bottom:3px;
  }
  .topic-item .info .p{
    font-size:11.5px;
    color:var(--muted);
  }
  .topic-item .badge{
    font-size:12px;
    font-weight:600;
    padding:5px 10px;
    border-radius:20px;
    white-space:nowrap;
    font-family:'Noto Serif KR', serif;
  }
  .badge.done{ background:rgba(53,96,63,0.12); color:var(--correct); }
  .badge.todo{ background:rgba(139,129,114,0.12); color:var(--muted); }
  .topic-item .arrow{ color:var(--muted); font-size:16px; }

  /* ---------- Quiz view ---------- */
  .quiz-head{
    margin-bottom:20px;
    padding-bottom:16px;
    border-bottom:2px solid var(--ink);
  }
  .quiz-head .back{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12.5px;
    color:var(--indigo);
    cursor:pointer;
    margin-bottom:12px;
    font-weight:500;
  }
  .quiz-head .back:hover{ text-decoration:underline; }
  .quiz-head .eyebrow{
    font-size:12px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .quiz-head h2{
    font-family:'Noto Serif KR', serif;
    font-size:21px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .quiz-head .pages{ font-size:12px; color:var(--muted); }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .progress-track{
    flex:1;
    height:6px;
    background:rgba(36,31,25,0.1);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--gold);
    border-radius:4px;
    transition:width .25s ease;
  }
  .progress-label{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }

  .question{
    padding:18px 0;
    border-bottom:1px solid rgba(36,31,25,0.14);
  }
  .question:last-of-type{ border-bottom:none; }
  .q-row{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .q-num{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    color:var(--seal);
    font-size:14px;
    min-width:22px;
    padding-top:2px;
  }
  .q-text{
    flex:1;
    font-size:14.5px;
    color:var(--ink);
  }
  .q-controls{
    display:flex;
    gap:10px;
    margin:14px 0 0 34px;
  }
  .ox-btn{
    width:52px;height:52px;
    border-radius:10px;
    border:2px solid rgba(36,31,25,0.3);
    background:transparent;
    font-family:'Noto Serif KR', serif;
    font-size:22px;
    font-weight:700;
    cursor:pointer;
    color:var(--ink-soft);
    transition: all .12s ease;
  }
  .ox-btn:hover{ border-color:var(--ink); }
  .ox-btn.o-btn.selected{
    background:var(--indigo);
    border-color:var(--indigo);
    color:var(--paper);
    transform:rotate(-3deg);
  }
  .ox-btn.x-btn.selected{
    background:var(--seal);
    border-color:var(--seal);
    color:var(--paper);
    transform:rotate(3deg);
  }

  /* graded state */
  .question.graded .q-controls{ pointer-events:none; }
  .question.correct{ background:rgba(53,96,63,0.05); border-radius:8px; }
  .question.incorrect{ background:rgba(156,43,39,0.05); border-radius:8px; }
  .result-tag{
    display:inline-block;
    margin-left:34px;
    margin-top:12px;
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    font-family:'Noto Serif KR', serif;
  }
  .result-tag.correct{ background:rgba(53,96,63,0.15); color:var(--correct); }
  .result-tag.incorrect{ background:rgba(156,43,39,0.15); color:var(--incorrect); }

  .explain{
    margin:12px 0 0 34px;
    padding:12px 14px;
    background:var(--paper-2);
    border-left:3px solid var(--gold);
    border-radius:0 8px 8px 0;
    font-size:13px;
    color:var(--ink-soft);
    display:none;
  }
  .question.graded .explain{ display:block; }
  .explain .lbl{
    font-weight:700;
    color:var(--ink);
    margin-right:4px;
  }

  .action-row{
    margin-top:26px;
    display:flex;
    gap:10px;
    justify-content:center;
  }
  .btn{
    font-family:'Noto Serif KR', serif;
    font-size:14.5px;
    font-weight:600;
    padding:13px 26px;
    border-radius:9px;
    border:2px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    transition:opacity .15s ease, transform .1s ease;
  }
  .btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }
  .btn.ghost{
    background:transparent;
    color:var(--ink);
  }
  .btn:not(:disabled):active{ transform:scale(0.97); }

  /* ---------- Score stamp ---------- */
  .score-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 0 30px;
    animation: pop-in .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop-in{
    0%{ transform:scale(0.6); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  .stamp{
    width:132px;height:132px;
    border-radius:50%;
    border:4px double var(--seal);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--seal);
    transform:rotate(-9deg);
    margin-bottom:14px;
    background:rgba(156,43,39,0.04);
  }
  .stamp .score-num{
    font-family:'Noto Serif KR', serif;
    font-size:34px;
    font-weight:700;
    line-height:1;
  }
  .stamp .score-den{
    font-size:11px;
    margin-top:3px;
    letter-spacing:1px;
  }
  .score-msg{
    font-family:'Noto Serif KR', serif;
    font-size:15px;
    color:var(--ink-soft);
    text-align:center;
  }
  .score-msg b{ color:var(--seal); }

  @media (max-width:480px){
    .app{ padding:18px 10px 60px; }
    .masthead h1{ font-size:24px; }
    .panel{ padding:20px 14px 26px; }
    .tab{ font-size:12.5px; padding:11px 4px 10px; }
    .tab .tag{ font-size:8.5px; }
    .q-controls{ margin-left:0; }
    .explain, .result-tag{ margin-left:0; }
  }

  /* ---------- Unit exam (객관식) ---------- */
  .opt-list{ display:flex; flex-direction:column; gap:8px; margin:14px 0 0 34px; }
  .opt-btn{
    display:flex; align-items:center; gap:10px;
    text-align:left; width:100%;
    padding:11px 14px;
    border:1.5px solid rgba(36,31,25,0.25);
    border-radius:8px;
    background:transparent;
    cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
    font-size:13.5px;
    color:var(--ink);
  }
  .opt-btn .opt-num{ font-family:'Noto Serif KR', serif; font-weight:700; color:var(--muted); min-width:16px; }
  .opt-btn.selected{ border-color:var(--indigo); background:rgba(47,66,86,0.08); }
  .opt-btn.selected .opt-num{ color:var(--indigo); }
  .opt-btn.correct-ans{ border-color:var(--correct); background:rgba(53,96,63,0.08); }
  .opt-btn.wrong-selected{ border-color:var(--incorrect); background:rgba(156,43,39,0.08); }
  .opt-btn:disabled{ cursor:default; }
  @media (max-width:480px){ .opt-list{ margin-left:0; } }

  /* ---------- Escape game chat ---------- */
  .escape-intro{ text-align:center; padding:40px 16px; }
  .escape-intro h2{ font-family:'Noto Serif KR', serif; font-size:19px; margin:10px 0 8px; }
  .escape-intro p{ font-size:13px; color:var(--ink-soft); max-width:420px; margin:0 auto 22px; line-height:1.7; }
  .chat-log{ display:flex; flex-direction:column; gap:14px; margin-bottom:16px; max-height:60vh; overflow-y:auto; padding-right:2px; }
  .msg{ max-width:88%; padding:12px 15px; border-radius:12px; font-size:13.5px; line-height:1.7; white-space:pre-line; }
  .msg.gm{ align-self:flex-start; background:var(--paper-2); border-left:3px solid var(--seal); font-family:'Noto Serif KR', serif; color:var(--ink); }
  .msg.player{ align-self:flex-end; background:var(--indigo); color:var(--paper); }
  .msg.loading{ align-self:flex-start; color:var(--muted); font-style:italic; }
  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row input{ flex:1; padding:12px 14px; border:1.5px solid rgba(36,31,25,0.3); border-radius:8px; background:var(--paper-2); font-family:'Noto Sans KR', sans-serif; font-size:14px; color:var(--ink); }
  .chat-input-row input:focus{ outline:none; border-color:var(--indigo); background:var(--paper); }
  .chat-input-row input:disabled{ opacity:0.5; }
  .escape-reset{ text-align:center; margin-top:14px; }

  /* ---------- Theme timer bar ---------- */
  .theme-timer-bar{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:9px 14px; margin-bottom:14px;
    background:var(--paper-2); border:1px solid rgba(36,31,25,0.15); border-radius:9px;
    font-family:'Noto Serif KR', serif; font-size:12.5px; color:var(--ink-soft);
  }
  .theme-timer-bar.done{ color:var(--correct); border-color:rgba(53,96,63,0.3); background:rgba(53,96,63,0.06); }
  .theme-timer-bar .ttb-time{ font-weight:700; color:var(--ink); }
  .theme-timer-bar.done .ttb-time{ color:var(--correct); }

  /* ---------- Escape game: act rail, stage tiles, modal ---------- */
  .act-rail{ display:flex; align-items:center; justify-content:center; gap:2px; margin:0 0 26px; flex-wrap:wrap; }
  .act-node{ display:flex; align-items:center; }
  .act-circle{
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif KR', serif; font-weight:700; font-size:11.5px;
    border:1.5px solid rgba(36,31,25,0.3); color:var(--muted); background:var(--paper-2);
  }
  .act-node.active .act-circle{ border-color:var(--seal); background:var(--seal); color:var(--paper); }
  .act-node.done .act-circle{ border-color:var(--correct); background:rgba(53,96,63,0.15); color:var(--correct); }
  .act-line{ width:12px; height:1.5px; background:rgba(36,31,25,0.2); }

  .stage-section{ padding:22px 0; border-bottom:1px solid rgba(36,31,25,0.14); }
  .stage-section:last-of-type{ border-bottom:none; }
  .stage-section.stage-locked{ opacity:0.4; padding:14px 0; }
  .stage-section.stage-done .stage-title{ color:var(--correct); }
  .stage-head{ margin-bottom:14px; }
  .stage-eyebrow{ font-size:11.5px; color:var(--muted); margin-bottom:4px; }
  .stage-title{ font-family:'Noto Serif KR', serif; font-size:17px; color:var(--ink); }
  .stage-lore{ font-size:13px; color:var(--ink-soft); margin-top:8px; line-height:1.65; max-width:520px; }

  .tile-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0; }
  .tile{
    border:1.5px solid rgba(36,31,25,0.25); border-radius:10px;
    padding:12px 6px; text-align:center; background:var(--paper-2);
  }
  .tile.current{ cursor:pointer; border-color:var(--indigo); background:rgba(47,66,86,0.08); }
  .tile.current:hover{ background:rgba(47,66,86,0.14); }
  .tile.solved{ border-color:var(--correct); background:rgba(53,96,63,0.08); }
  .tile.locked{ opacity:0.5; }
  .tile-num{ font-family:'Noto Serif KR', serif; font-weight:700; font-size:15px; color:var(--ink); margin-bottom:4px; }
  .tile.solved .tile-num{ color:var(--correct); }
  .tile.current .tile-num{ color:var(--indigo); }
  .tile-label{ font-size:10.5px; color:var(--muted); }

  .pieces-line{ font-size:12.5px; color:var(--ink-soft); margin:8px 0; }
  .combine-panel{ margin-top:10px; padding:14px; background:var(--paper-2); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; }
  .combine-panel.done{ border-left-color:var(--correct); font-family:'Noto Serif KR', serif; font-size:14px; color:var(--correct); }
  .combine-panel.done .lbl{ color:var(--ink-soft); font-family:'Noto Sans KR', sans-serif; font-size:12px; margin-right:6px; }
  .combine-intro{ font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; }
  .feedback-line{ margin-top:10px; font-size:12.5px; color:var(--seal); }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(36,31,25,0.55);
    display:flex; align-items:center; justify-content:center; z-index:60; padding:20px;
  }
  .modal-card{
    position:relative; width:100%; max-width:420px;
    background:var(--paper); border:1px solid var(--ink); border-radius:14px;
    padding:26px 22px 22px;
  }
  .modal-close{
    position:absolute; top:10px; right:14px; background:none; border:none;
    font-size:22px; color:var(--muted); cursor:pointer; line-height:1;
  }
  .modal-eyebrow{ font-size:11.5px; color:var(--muted); margin-bottom:10px; }
  .modal-q{ font-family:'Noto Serif KR', serif; font-size:15px; color:var(--ink); line-height:1.6; margin-bottom:16px; white-space:pre-line; }
  .modal-card .opt-list{ margin:0 0 4px; }
  @media (max-width:600px){ .tile-grid{ grid-template-columns:repeat(2,1fr); } }

  /* ---------- Escape game: per-act theme variety ---------- */
  .stage-section.layout-doc{ border-left:3px solid var(--seal); padding-left:14px; }
  .stage-section.layout-stat{ border-left:3px solid var(--indigo); padding-left:14px; }
  .stage-section.layout-map{ border-left:3px solid var(--correct); padding-left:14px; }
  .stage-section.layout-quote{ border-left:3px solid var(--gold); padding-left:14px; }
  .stage-section.layout-portrait{ border-left:3px solid var(--seal-soft); padding-left:14px; }
  .stage-section.layout-timeline{ border-left:3px solid var(--indigo-soft); padding-left:14px; }
  .stage-section.layout-org{ border-left:3px solid var(--muted); padding-left:14px; }
  .stage-section.layout-slogan{ border-left:3px solid var(--incorrect); padding-left:14px; }
  .stage-section.layout-conference{ border-left:3px solid var(--gold); padding-left:14px; }

  .tile-region{ font-size:10px; color:var(--indigo); font-weight:600; margin-bottom:4px; }

  .tile-grid.layout-portrait .tile{ border-radius:50%; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px; }

/* =========================================================
   STORAGE HELPERS (Firebase Firestore — shared, so teacher can view all students)
========================================================= */
async function loadStudentRecord(studentKey){
  if(!hasStorage) return null;
  try{
    const doc = await db.collection('students').doc(studentKey).get();
    return doc.exists ? doc.data() : null;
  }catch(e){
    console.error('불러오기에 실패했습니다', e);
    return null;
  }
}

async function saveStudentRecord(record){
  if(!hasStorage) return;
  try{
    record.updatedAt = Date.now();
    await db.collection('students').doc(record.studentKey).set(record);
  }catch(e){
    console.error('저장에 실패했습니다', e);
  }
}

async function loadAllStudentRecords(){
  if(!hasStorage) return [];
  try{
    const snap = await db.collection('students').get();
    return snap.docs.map(d=>d.data());
  }catch(e){
    console.error('목록을 불러오는 데 실패했습니다', e);
    return [];
  }
}

async function loginAsStudent(grade, classNum, number, name){
  const studentKey = `${grade}-${classNum}-${number}`;
  let record = await loadStudentRecord(studentKey);
  if(!record){
    record = { studentKey, grade, classNum, number, name, progress: {}, timers: {} };
    await saveStudentRecord(record);
  } else {
    record.name = name; // keep latest typed name
    record.grade = grade; record.classNum = classNum; record.number = number;
    if(!record.progress) record.progress = {};
    if(!record.timers) record.timers = {};
  }
  studentRecord = record;
  session = { role:'student', studentKey, grade, classNum, number, name: record.name };

  // hydrate in-memory quiz state from saved progress
  results = {};
  userAnswers = {};
  topics.forEach((t,i)=>{
    const p = record.progress[i];
    if(p){
      userAnswers[i] = (p.answers && p.answers.length===t.questions.length) ? p.answers.slice() : new Array(t.questions.length).fill(null);
      if(p.graded) results[i] = { score:p.score, total:p.total };
    }
  });
  if(record.examProgress){
    const ep = record.examProgress;
    examAnswers = (ep.answers && ep.answers.length===examData.questions.length) ? ep.answers.slice() : new Array(examData.questions.length).fill(null);
    examResult = ep.graded ? { score:ep.score, total:ep.total } : null;
  } else {
    examAnswers = new Array(examData.questions.length).fill(null);
    examResult = null;
  }
  shortAnswers = {}; shortResults = {};
  shortTopics.forEach((t,i)=>{
    const sp = record.shortProgress && record.shortProgress[i];
    if(sp){
      shortAnswers[i] = (sp.answers && sp.answers.length===t.questions.length) ? sp.answers.slice() : new Array(t.questions.length).fill('');
      if(sp.graded) shortResults[i] = { score:sp.score, total:sp.total };
    }
  });
  if(record.escapeProgress){
    const ep = record.escapeProgress;
    escapeStage = Math.min(ep.stage || 0, escapeStages.length - 1);
    escapeSubIndex = ep.subIndex || 0;
    escapeCollected = Array.isArray(ep.collected) ? ep.collected.slice() : [];
    escapeCleared = !!ep.cleared;
    escapeStarted = false; // 이어할 때도 시작 화면에서 "게임 시작하기"를 눌러 재개
  } else {
    escapeStage = 0; escapeSubIndex = 0; escapeCollected = []; escapeCleared = false;
    escapeStarted = false;
  }
  escapeModalMissionIdx = null; escapeModalFeedback = ''; escapeCombineFeedback = '';

  currentTab = 1; currentTopicIdx = null;
  enterApp();
}

function syncProgressToStorage(idx){
  if(!session || session.role !== 'student' || !studentRecord) return;
  if(!studentRecord.progress) studentRecord.progress = {};
  const total = topics[idx].questions.length;
  studentRecord.progress[idx] = {
    answers: userAnswers[idx] ? userAnswers[idx].slice() : new Array(total).fill(null),
    graded: !!results[idx],
    score: results[idx] ? results[idx].score : null,
    total: total
  };
  saveStudentRecord(studentRecord);
}

function syncExamToStorage(){
  if(!session || session.role !== 'student' || !studentRecord) return;
  studentRecord.examProgress = {
    answers: examAnswers.slice(),
    graded: !!examResult,
    score: examResult ? examResult.score : null,
    total: examData.questions.length
  };
  saveStudentRecord(studentRecord);
}

function syncShortToStorage(idx){
  if(!session || session.role !== 'student' || !studentRecord) return;
  if(!studentRecord.shortProgress) studentRecord.shortProgress = {};
  const total = shortTopics[idx].questions.length;
  studentRecord.shortProgress[idx] = {
    answers: shortAnswers[idx] ? shortAnswers[idx].slice() : new Array(total).fill(''),
    graded: !!shortResults[idx],
    score: shortResults[idx] ? shortResults[idx].score : null,
    total: total
  };
  saveStudentRecord(studentRecord);
}

/* =========================================================
   THEME TIMER BAR (탭 1~4 학생 전용)
========================================================= */
const THEME_KEYS = {1:'ox', 2:'short', 3:'exam', 4:'escape'};
const THEME_TIMER_LABELS = {ox:'OX 퀴즈', short:'단답 퀴즈', exam:'단원 평가', escape:'방탈출 게임'};
let themeTimerIntervalId = null;
let themeTimerRunningKey = null;

function isThemeComplete(themeKey){
  if(themeKey==='ox') return Object.keys(results).length === topics.length;
  if(themeKey==='short') return Object.keys(shortResults).length === shortTopics.length;
  if(themeKey==='exam') return !!examResult;
  if(themeKey==='escape') return !!escapeCleared;
  return false;
}

function formatDuration(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function updateThemeTimerBar(){
  const bar = document.getElementById('themeTimerBar');
  if(!bar) return;
  const themeKey = THEME_KEYS[currentTab];
  if(!session || session.role !== 'student' || !themeKey){
    bar.style.display = 'none';
    if(themeTimerIntervalId){ clearInterval(themeTimerIntervalId); themeTimerIntervalId = null; themeTimerRunningKey = null; }
    return;
  }
  if(!studentRecord.timers) studentRecord.timers = {};
  if(!studentRecord.timers[themeKey]) studentRecord.timers[themeKey] = { startedAt:null, completedAt:null, elapsedMs:null };
  const timer = studentRecord.timers[themeKey];
  const completedNow = isThemeComplete(themeKey);

  if(completedNow && !timer.completedAt){
    timer.completedAt = Date.now();
    timer.elapsedMs = timer.startedAt ? (timer.completedAt - timer.startedAt) : (timer.elapsedMs || 0);
    saveStudentRecord(studentRecord);
  }
  if(!completedNow && !timer.startedAt){
    timer.startedAt = Date.now();
    saveStudentRecord(studentRecord);
  }

  bar.style.display = 'flex';
  const label = THEME_TIMER_LABELS[themeKey];

  if(timer.completedAt){
    if(themeTimerIntervalId){ clearInterval(themeTimerIntervalId); themeTimerIntervalId = null; themeTimerRunningKey = null; }
    bar.className = 'theme-timer-bar done';
    bar.innerHTML = `✅ ${label} 완료 · 소요 시간 <span class="ttb-time">${formatDuration(timer.elapsedMs || 0)}</span>`;
  } else {
    bar.className = 'theme-timer-bar';
    const tick = ()=>{
      const elapsed = Date.now() - timer.startedAt;
      bar.innerHTML = `⏱ ${label} 진행 중 · <span class="ttb-time">${formatDuration(elapsed)}</span>`;
    };
    tick();
    if(themeTimerRunningKey !== themeKey){
      if(themeTimerIntervalId) clearInterval(themeTimerIntervalId);
      themeTimerIntervalId = setInterval(tick, 1000);
      themeTimerRunningKey = themeKey;
    }
  }
}

/* =========================================================
   RENDER: MAIN SWITCH
========================================================= */
function render(){
  renderTabs();

  if(session && session.role === 'teacher'){
    document.getElementById('themeTimerBar').style.display = 'none';
    renderDashboardLoading();
    loadDashboardData();
    return;
  }

  updateThemeTimerBar();

  if(currentTab===5){ renderLecture(); return; }
  if(currentTab===4){ renderEscape(); return; }
  if(currentTab===3){ renderExam(); return; }
  if(currentTab===2){
    if(currentShortTopicIdx===null){ renderShortTOC(); } else { renderShortQuiz(currentShortTopicIdx); }
    return;
  }

  if(currentTopicIdx===null){ renderTOC(); }
  else{ renderQuiz(currentTopicIdx); }
}

/* =========================================================
   SHORT-ANSWER QUIZ VIEW (탭 2)
========================================================= */
function renderShortTOC(){
  const doneCount = Object.keys(shortResults).length;
  const totalCount = shortTopics.length;
  let avgText = "-";
  if(doneCount>0){
    const totalScore = Object.values(shortResults).reduce((a,r)=>a+r.score,0);
    const totalQ = Object.values(shortResults).reduce((a,r)=>a+r.total,0);
    avgText = Math.round((totalScore/totalQ)*100) + "%";
  }
  let html = `
    <div class="toc-summary">
      <div>완료한 주제: <b>${doneCount}</b> / ${totalCount}</div>
      <div>평균 정답률: <span class="big">${avgText}</span></div>
    </div>`;
  shortTopics.forEach((t,i)=>{
    const r = shortResults[i];
    const badge = r ? `<span class="badge done">${r.score}/${r.total}</span>` : `<span class="badge todo">${t.questions.length}문항</span>`;
    html += `
      <div class="topic-item" data-idx="${i}">
        <div class="idx">${t.unit}</div>
        <div class="info"><div class="t">${t.title}</div><div class="p">${t.pages}</div></div>
        ${badge}
        <div class="arrow">›</div>
      </div>`;
  });
  panelEl.innerHTML = html;
  panelEl.querySelectorAll('.topic-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentShortTopicIdx = Number(el.dataset.idx);
      if(!shortAnswers[currentShortTopicIdx]){
        shortAnswers[currentShortTopicIdx] = new Array(shortTopics[currentShortTopicIdx].questions.length).fill('');
      }
      render();
    });
  });
}

function renderShortQuiz(idx){
  const topic = shortTopics[idx];
  const answers = shortAnswers[idx];
  const graded = !!shortResults[idx];

  let qHtml = topic.questions.map((q,qi)=>{
    const userAns = answers[qi] || '';
    let stateClass = '', resultTag = '', inputClass = '';
    if(graded){
      const correct = isShortAnswerCorrect(userAns, q.answers);
      stateClass = correct ? 'correct' : 'incorrect';
      inputClass = correct ? 'correct' : 'incorrect';
      resultTag = correct ? `<div class="result-tag correct">정답</div>` : `<div class="result-tag incorrect">오답 · 정답: ${q.answers[0]}</div>`;
    }
    return `
      <div class="question ${graded?'graded':''} ${stateClass}" data-qi="${qi}">
        <div class="q-row"><div class="q-num">${qi+1}.</div><div class="q-text">${q.q}</div></div>
        <div class="short-input-row">
          <input type="text" class="${inputClass}" data-qi="${qi}" value="${userAns.replace(/"/g,'&quot;')}" placeholder="답을 입력하세요" ${graded?'disabled':''} autocomplete="off">
        </div>
        ${resultTag}
        <div class="explain"><span class="lbl">해설.</span>${q.explain}</div>
      </div>`;
  }).join('');

  let scoreHtml = '';
  if(graded){
    const r = shortResults[idx];
    const pct = Math.round((r.score/r.total)*100);
    let msg = pct===100 ? "완벽해요! 핵심 용어를 정확히 기억하고 있습니다." :
              pct>=80 ? "아주 잘했어요! 오답 해설을 확인해 보세요." :
              pct>=60 ? "틀린 문항의 정답과 해설을 꼭 다시 읽어보세요." :
              "이 주제의 핵심 용어를 교과서에서 다시 확인해 보세요.";
    scoreHtml = `
      <div class="score-wrap">
        <div class="stamp"><div class="score-num">${pct}</div><div class="score-den">점 / ${r.score} · ${r.total}</div></div>
        <div class="score-msg">${msg}</div>
      </div>`;
  }

  panelEl.innerHTML = `
    <div class="quiz-head">
      <div class="back" id="backBtn">‹ 목차로 돌아가기</div>
      <div class="eyebrow">${topic.unit}</div>
      <h2>${topic.title}</h2>
      <div class="pages">${topic.pages}</div>
    </div>
    ${scoreHtml}
    <div class="questions">${qHtml}</div>
    <div class="action-row">
      ${!graded ? `<button class="btn" id="shortGradeBtn">채점하기</button>` : `<button class="btn" id="shortRetryBtn">다시 풀기</button>`}
      <button class="btn ghost" id="shortTocBtn">목차로</button>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', ()=>{ currentShortTopicIdx=null; render(); });
  document.getElementById('shortTocBtn').addEventListener('click', ()=>{ currentShortTopicIdx=null; render(); });

  if(!graded){
    panelEl.querySelectorAll('.short-input-row input').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const qi = Number(inp.dataset.qi);
        answers[qi] = inp.value;
        syncShortToStorage(idx);
      });
    });
    document.getElementById('shortGradeBtn').addEventListener('click', ()=>{
      let score = 0;
      topic.questions.forEach((q,qi)=>{ if(isShortAnswerCorrect(answers[qi]||'', q.answers)) score++; });
      shortResults[idx] = { score, total: topic.questions.length };
      syncShortToStorage(idx);
      renderShortQuiz(idx);
    });
  } else {
    document.getElementById('shortRetryBtn').addEventListener('click', ()=>{
      delete shortResults[idx];
      shortAnswers[idx] = new Array(topic.questions.length).fill('');
      if(session && session.role==='student' && studentRecord && studentRecord.shortProgress){
        delete studentRecord.shortProgress[idx];
        saveStudentRecord(studentRecord);
      }
      renderShortQuiz(idx);
    });
  }
}

/* =========================================================
   UNIT EXAM VIEW (탭 3)
========================================================= */
function renderExam(){
  const graded = !!examResult;
  const answeredCount = examAnswers.filter(a=>a!==null).length;
  const allAnswered = answeredCount === examData.questions.length;

  let qHtml = examData.questions.map((q,qi)=>{
    const userAns = examAnswers[qi];
    let stateClass = '', resultTag = '';
    if(graded){
      const isCorrect = userAns === q.answer;
      stateClass = isCorrect ? 'correct' : 'incorrect';
      resultTag = isCorrect ? `<div class="result-tag correct">정답</div>` : `<div class="result-tag incorrect">오답 · 정답은 ${q.answer+1}번</div>`;
    }
    const optsHtml = q.options.map((opt,oi)=>{
      let cls = userAns===oi ? 'selected' : '';
      if(graded){
        if(oi===q.answer) cls += ' correct-ans';
        else if(oi===userAns) cls += ' wrong-selected';
      }
      return `<button class="opt-btn ${cls}" data-oi="${oi}" ${graded?'disabled':''}><span class="opt-num">${oi+1}</span>${opt}</button>`;
    }).join('');
    return `
      <div class="question ${graded?'graded':''} ${stateClass}" data-qi="${qi}">
        <div class="q-row"><div class="q-num">${qi+1}.</div><div class="q-text" style="white-space:pre-line;">${q.text}</div></div>
        <div class="opt-list">${optsHtml}</div>
        ${resultTag}
        <div class="explain"><span class="lbl">해설.</span>${q.explain}</div>
      </div>
    `;
  }).join('');

  let scoreHtml = '';
  if(graded){
    const pct = Math.round((examResult.score/examResult.total)*100);
    let msg = pct===100 ? "완벽해요! 대단원 전체를 정확히 이해했습니다." :
              pct>=80 ? "아주 잘했어요! 오답 해설을 확인해 보세요." :
              pct>=60 ? "틀린 문항의 해설을 꼭 다시 읽어보세요." :
              "교과서를 다시 한번 꼼꼼히 복습해 보세요.";
    scoreHtml = `
      <div class="score-wrap">
        <div class="stamp"><div class="score-num">${pct}</div><div class="score-den">점 / ${examResult.score} · ${examResult.total}</div></div>
        <div class="score-msg">${msg}</div>
      </div>`;
  }

  panelEl.innerHTML = `
    <div class="quiz-head">
      <div class="eyebrow">${examData.unit}</div>
      <h2>${examData.title}</h2>
      <div class="pages">객관식 8문항</div>
    </div>
    ${scoreHtml}
    ${!graded ? `
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${(answeredCount/examData.questions.length)*100}%"></div></div>
      <div class="progress-label">${answeredCount} / ${examData.questions.length} 답변</div>
    </div>` : ''}
    <div class="questions">${qHtml}</div>
    <div class="action-row">
      ${!graded ? `<button class="btn" id="examGradeBtn" ${allAnswered?'':'disabled'}>채점하기</button>` : `<button class="btn" id="examRetryBtn">다시 풀기</button>`}
    </div>
  `;

  if(!graded){
    panelEl.querySelectorAll('.opt-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const qi = Number(btn.closest('.question').dataset.qi);
        examAnswers[qi] = Number(btn.dataset.oi);
        syncExamToStorage();
        renderExam();
      });
    });
    const gradeBtn = document.getElementById('examGradeBtn');
    if(gradeBtn){
      gradeBtn.addEventListener('click', ()=>{
        let score = 0;
        examData.questions.forEach((q,qi)=>{ if(examAnswers[qi]===q.answer) score++; });
        examResult = { score, total: examData.questions.length };
        syncExamToStorage();
        renderExam();
      });
    }
  } else {
    document.getElementById('examRetryBtn').addEventListener('click', ()=>{
      examResult = null;
      examAnswers = new Array(examData.questions.length).fill(null);
      if(session && session.role==='student' && studentRecord){ delete studentRecord.examProgress; saveStudentRecord(studentRecord); }
      renderExam();
    });
  }
}

/* =========================================================
   ESCAPE GAME VIEW (탭 4) — 10막 × 4미션 타일 + 막(Act) 진행바 + 모달
   사전 스크립트 기반, 네트워크 호출 없음
========================================================= */
function syncEscapeToStorage(){
  if(!session || session.role !== 'student' || !studentRecord) return;
  studentRecord.escapeProgress = {
    stage: escapeStage,
    subIndex: escapeSubIndex,
    collected: escapeCollected.slice(),
    cleared: escapeCleared
  };
  saveStudentRecord(studentRecord);
}

function renderEscape(){
  if(!escapeStarted){
    panelEl.innerHTML = `
      <div class="escape-intro">
        <div class="stamp-mini" style="margin:0 auto 18px;">1945<br>光復</div>
        <h2>일제 강점기 탈출 - 독립을 향한 10막</h2>
        <p>당신은 1910년대, 무단 통치의 수탈을 피해 간도로 망명한 청년입니다. 막(幕)마다 성격이 다른 미션이 기다립니다 — 법령 문서, 통계 그래프, 지도, 사료 인용문, 초상, 연표, 조직도, 격문, 국제 회담까지. 조각을 모아 암호를 완성해야 다음 막으로 나아갈 수 있습니다. 총 10막, 40개의 미션이 기다립니다.</p>
        <button class="btn" id="escapeStartBtn">게임 시작하기</button>
      </div>`;
    document.getElementById('escapeStartBtn').addEventListener('click', ()=>{
      escapeStarted = true;
      syncEscapeToStorage();
      renderEscape();
    });
    return;
  }

  const totalStages = escapeStages.length;

  // --- act rail ---
  let railHtml = '<div class="act-rail">';
  escapeStages.forEach((st,i)=>{
    const state = i < escapeStage || escapeCleared ? 'done' : (i === escapeStage ? 'active' : 'locked');
    railHtml += `<div class="act-node ${state}"><div class="act-circle">${state==='done' ? '✓' : (i+1)}</div></div>`;
    if(i < totalStages-1) railHtml += '<div class="act-line"></div>';
  });
  railHtml += '</div>';

  // --- ending banner ---
  let endingHtml = '';
  if(escapeCleared){
    endingHtml = `
      <div class="score-wrap">
        <div class="stamp"><div class="score-num">광복</div><div class="score-den">10막 · 40미션 모두 클리어</div></div>
        <div class="score-msg">1945년 8월 15일, 당신은 마침내 광복을 맞이하였습니다. 수고하셨어요!</div>
      </div>`;
  }

  // --- stage sections ---
  let stagesHtml = '';
  escapeStages.forEach((st,i)=>{
    const isDone = i < escapeStage || escapeCleared;
    const isActive = i === escapeStage && !escapeCleared;
    const isLocked = !isDone && !isActive;
    const layout = st.layout || 'doc';

    if(isLocked){
      stagesHtml += `
        <section class="stage-section stage-locked layout-${layout}">
          <div class="stage-head">
            <div class="stage-eyebrow">${st.eyebrow} · ${st.theme || ''}</div>
            <div class="stage-title">🔒 ${st.title}</div>
          </div>
        </section>`;
      return;
    }

    // decorative stat chart (stage 2 only, when statChart is defined)
    let statHtml = '';
    if(st.statChart){
      statHtml = '<div class="stat-chart">' + st.statChart.map(row=>{
        const maxV = Math.max(row.before, row.after);
        const beforePct = Math.max(6, Math.round(row.before/maxV*100));
        const afterPct = Math.max(6, Math.round(row.after/maxV*100));
        return `
          <div class="stat-row">
            <div class="stat-row-label">${row.label}</div>
            <div class="stat-bars">
              <div class="stat-bar-wrap"><div class="stat-bar before" style="height:${beforePct}%;"></div><span>1918 · ${row.before.toLocaleString()}${row.unit}</span></div>
              <div class="stat-bar-wrap"><div class="stat-bar after" style="height:${afterPct}%;"></div><span>1920 · ${row.after.toLocaleString()}${row.unit}</span></div>
            </div>
          </div>`;
      }).join('') + '</div>';
    }

    const solvedCount = isDone ? st.missions.length : escapeSubIndex;
    const useRow = (layout === 'timeline' || layout === 'org');
    let tilesHtml = `<div class="tile-grid ${useRow ? 'tile-row' : ''} layout-${layout}">`;
    st.missions.forEach((m,mi)=>{
      let tState = 'locked';
      if(mi < solvedCount) tState = 'solved';
      else if(isActive && mi === escapeSubIndex) tState = 'current';
      const capLabel = m.regionLabel ? `<div class="tile-region">📍 ${m.regionLabel}</div>` : '';
      tilesHtml += `
        <div class="tile ${tState}" ${tState==='current' ? `data-mission="${mi}"` : ''}>
          ${capLabel}
          <div class="tile-num">${tState==='solved' ? '✓' : mi+1}</div>
          <div class="tile-label">${tState==='solved' ? `조각: ${m.fragment}` : (tState==='current' ? '미션 도전' : '잠김')}</div>
        </div>`;
      if(useRow && mi < st.missions.length-1) tilesHtml += '<div class="tile-arrow">→</div>';
    });
    tilesHtml += '</div>';

    let combineHtml = '';
    if(isDone){
      const finalWord = st.missions.map(m=>m.fragment).join('');
      combineHtml = `<div class="combine-panel done"><span class="lbl">완성된 암호</span> ${finalWord} ✓</div>`;
    } else if(isActive && escapeSubIndex >= st.missions.length){
      const pieces = escapeCollected.join(' · ');
      combineHtml = `
        <div class="combine-panel">
          <div class="pieces-line">모은 조각: ${pieces}</div>
          <div class="combine-intro">조각을 순서대로 이어 붙이면 어떤 이름이 될까요?</div>
          <div class="chat-input-row">
            <input type="text" id="combineInput" placeholder="최종 암호를 입력하세요..." autocomplete="off">
            <button class="btn" id="combineSendBtn">완성</button>
          </div>
          ${escapeCombineFeedback ? `<div class="feedback-line">${escapeCombineFeedback}</div>` : ''}
        </div>`;
    } else if(isActive){
      const pieces = escapeCollected.length ? escapeCollected.join(' · ') : '아직 없음';
      combineHtml = `<div class="pieces-line">모은 조각: ${pieces}</div>`;
    }

    stagesHtml += `
      <section class="stage-section layout-${layout} ${isDone ? 'stage-done' : ''}">
        <div class="stage-head">
          <div class="stage-eyebrow">${st.eyebrow} · ${st.theme || ''}</div>
          <div class="stage-title">${st.title}</div>
          <p class="stage-lore">${st.lore}</p>
        </div>
        ${statHtml}
        ${tilesHtml}
        ${combineHtml}
      </section>`;
  });

  // --- modal ---
  let modalHtml = '';
  if(escapeModalMissionIdx !== null && !escapeCleared){
    const stage = escapeStages[escapeStage];
    const m = stage.missions[escapeModalMissionIdx];
    let answerAreaHtml = '';
    if(m.type === 'mcq'){
      answerAreaHtml = `<div class="opt-list">` + m.options.map((opt,oi)=>
        `<button class="opt-btn" data-opt="${oi}">${opt}</button>`
      ).join('') + `</div>`;
    } else {
      answerAreaHtml = `
        <div class="chat-input-row">
          <input type="text" id="missionInput" placeholder="정답을 입력하세요..." autocomplete="off">
          <button class="btn" id="missionSendBtn">제출</button>
        </div>`;
    }
    modalHtml = `
      <div class="modal-overlay" id="missionModalOverlay">
        <div class="modal-card">
          <button class="modal-close" id="modalCloseBtn">×</button>
          <div class="modal-eyebrow">${stage.eyebrow} · 미션 ${escapeModalMissionIdx+1}/${stage.missions.length}</div>
          <div class="modal-q">${m.q}</div>
          ${answerAreaHtml}
          ${escapeModalFeedback ? `<div class="feedback-line">${escapeModalFeedback}</div>` : ''}
        </div>
      </div>`;
  }

  panelEl.innerHTML = `
    <div class="quiz-head">
      <div class="eyebrow">방탈출 게임 · 10막 · 40미션</div>
      <h2>독립을 향한 여정</h2>
    </div>
    ${endingHtml}
    ${railHtml}
    ${stagesHtml}
    <div class="escape-reset"><button class="icon-btn" id="escapeResetBtn">게임 새로 시작</button></div>
    ${modalHtml}
  `;

  // wire up tile clicks (only 'current' tiles are clickable)
  panelEl.querySelectorAll('.tile.current').forEach(el=>{
    el.addEventListener('click', ()=>{
      escapeModalMissionIdx = Number(el.dataset.mission);
      escapeModalFeedback = '';
      renderEscape();
    });
  });

  // wire up combine input (if present)
  const combineInput = document.getElementById('combineInput');
  if(combineInput){
    const doCombine = ()=>{
      const text = combineInput.value.trim();
      if(!text) return;
      submitCombineAnswer(text);
    };
    document.getElementById('combineSendBtn').addEventListener('click', doCombine);
    combineInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doCombine(); });
  }

  // wire up modal
  if(escapeModalMissionIdx !== null){
    const overlay = document.getElementById('missionModalOverlay');
    document.getElementById('modalCloseBtn').addEventListener('click', ()=>{
      escapeModalMissionIdx = null; escapeModalFeedback = '';
      renderEscape();
    });
    overlay.addEventListener('click', (e)=>{
      if(e.target === overlay){ escapeModalMissionIdx = null; escapeModalFeedback = ''; renderEscape(); }
    });
    const stage = escapeStages[escapeStage];
    const m = stage.missions[escapeModalMissionIdx];
    if(m.type === 'mcq'){
      panelEl.querySelectorAll('.opt-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          submitMissionAnswer(Number(btn.dataset.opt));
        });
      });
    } else {
      const missionInput = document.getElementById('missionInput');
      const doSubmitMission = ()=>{
        const text = missionInput.value.trim();
        if(!text) return;
        submitMissionAnswer(text);
      };
      document.getElementById('missionSendBtn').addEventListener('click', doSubmitMission);
      missionInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSubmitMission(); });
      missionInput.focus();
    }
  }

  document.getElementById('escapeResetBtn').addEventListener('click', resetEscapeGame);
}

function submitMissionAnswer(payload){
  const stage = escapeStages[escapeStage];
  const m = stage.missions[escapeModalMissionIdx];
  const correct = (m.type === 'mcq') ? (payload === m.correctIndex) : isShortAnswerCorrect(payload, m.accepted);
  if(correct){
    escapeCollected.push(m.fragment);
    escapeSubIndex++;
    escapeModalMissionIdx = null;
    escapeModalFeedback = '';
    syncEscapeToStorage();
  } else {
    escapeModalFeedback = `힌트: ${m.hint}`;
  }
  renderEscape();
}

function submitCombineAnswer(text){
  const stage = escapeStages[escapeStage];
  const target = stage.missions.map(m=>m.fragment).join('');
  if(isShortAnswerCorrect(text, [target])){
    escapeCombineFeedback = '';
    if(escapeStage >= escapeStages.length - 1){
      escapeCleared = true;
    } else {
      escapeStage++;
      escapeSubIndex = 0;
      escapeCollected = [];
    }
    syncEscapeToStorage();
  } else {
    escapeCombineFeedback = `힌트: 조각을 순서대로 이어 붙여 보세요 → ${escapeCollected.join(' + ')}`;
  }
  renderEscape();
}

function resetEscapeGame(){
  escapeStarted = false; escapeStage = 0; escapeSubIndex = 0; escapeCollected = []; escapeCleared = false;
  escapeModalMissionIdx = null; escapeModalFeedback = ''; escapeCombineFeedback = '';
  syncEscapeToStorage();
  renderEscape();
}

/* =========================================================
   TEACHER DASHBOARD
========================================================= */
function renderDashboardLoading(){
  panelEl.innerHTML = `
    <div class="empty-dash">
      <div class="stamp-mini" style="margin:0 auto 16px;">조회<br>중</div>
      학생들의 학습 기록을 불러오는 중입니다...
    </div>`;
}

async function loadDashboardData(){
  const records = await loadAllStudentRecords();
  if(!session || session.role !== 'teacher') return; // user logged out while loading
  renderDashboardContent(records);
}

const DASH_THEME_DEFS = [
  { key:'ox', label:'① OX 퀴즈', totalUnits: topics.length },
  { key:'short', label:'② 단답 퀴즈', totalUnits: shortTopics.length },
  { key:'exam', label:'③ 단원 평가', totalUnits: 1 },
  { key:'escape', label:'④ 방탈출 게임', totalUnits: escapeStages.length * 4 }
];

function computeThemeInfo(record, themeKey){
  let doneUnits = 0, scoreSum = 0, totalSum = 0, hasScore = false, progressPct = 0;
  if(themeKey === 'ox'){
    const prog = record.progress || {};
    const graded = Object.keys(prog).filter(k=>prog[k].graded);
    doneUnits = graded.length;
    graded.forEach(k=>{ scoreSum += prog[k].score; totalSum += prog[k].total; });
    hasScore = totalSum > 0;
    progressPct = Math.round(doneUnits / topics.length * 100);
  } else if(themeKey === 'short'){
    const prog = record.shortProgress || {};
    const graded = Object.keys(prog).filter(k=>prog[k].graded);
    doneUnits = graded.length;
    graded.forEach(k=>{ scoreSum += prog[k].score; totalSum += prog[k].total; });
    hasScore = totalSum > 0;
    progressPct = Math.round(doneUnits / shortTopics.length * 100);
  } else if(themeKey === 'exam'){
    const ep = record.examProgress;
    if(ep && ep.graded){ scoreSum = ep.score; totalSum = ep.total; hasScore = true; doneUnits = 1; }
    progressPct = (ep && ep.graded) ? 100 : 0;
  } else if(themeKey === 'escape'){
    const ep = record.escapeProgress;
    if(ep){
      if(ep.cleared){ progressPct = 100; }
      else { progressPct = Math.round(((ep.stage||0)*4 + (ep.subIndex||0)) / (escapeStages.length*4) * 100); }
    }
    hasScore = false; // 방탈출은 정오답 점수 대신 진행률·시간으로 표시
  }
  const scorePct = hasScore ? Math.round(scoreSum/totalSum*100) : null;

  const timer = record.timers && record.timers[themeKey];
  let timeLabel = '-';
  let timeMs = null;
  if(timer){
    if(timer.completedAt){
      timeMs = timer.elapsedMs || 0;
      timeLabel = formatDuration(timeMs);
    } else if(timer.startedAt){
      timeMs = Date.now() - timer.startedAt;
      timeLabel = `진행 중 (${formatDuration(timeMs)})`;
    }
  }
  return { progressPct, scorePct, timeLabel, timeMs, completed: progressPct>=100 };
}

function renderDashboardContent(records){
  // per-student aggregated stats
  const studentStats = records.map(r=>{
    const themeInfo = {};
    DASH_THEME_DEFS.forEach(td=>{ themeInfo[td.key] = computeThemeInfo(r, td.key); });
    const scoreVals = ['ox','short','exam'].map(k=>themeInfo[k].scorePct).filter(v=>v!==null);
    const overallScore = scoreVals.length ? Math.round(scoreVals.reduce((a,b)=>a+b,0)/scoreVals.length) : null;
    const progressVals = DASH_THEME_DEFS.map(td=>themeInfo[td.key].progressPct);
    const overallProgress = Math.round(progressVals.reduce((a,b)=>a+b,0)/progressVals.length);
    const classLabel = `${r.grade}학년 ${r.classNum}반`;
    return { key:r.studentKey, grade:r.grade, classNum:r.classNum, number:r.number, name:r.name, classLabel, themeInfo, overallScore, overallProgress };
  }).sort((a,b)=>{
    if(a.grade !== b.grade) return Number(a.grade) - Number(b.grade);
    if(a.classNum !== b.classNum) return Number(a.classNum) - Number(b.classNum);
    return Number(a.number) - Number(b.number);
  });

  const totalStudents = studentStats.length;

  function aggregate(list){
    const scoreVals = list.map(s=>s.overallScore).filter(v=>v!==null);
    const avgScore = scoreVals.length ? Math.round(scoreVals.reduce((a,b)=>a+b,0)/scoreVals.length) : null;
    const avgProgress = list.length ? Math.round(list.reduce((a,s)=>a+s.overallProgress,0)/list.length) : 0;
    const fullyDone = list.filter(s=>s.overallProgress>=100).length;
    return { count:list.length, avgScore, avgProgress, fullyDone };
  }
  const overallAgg = aggregate(studentStats);

  // group by class
  const classGroups = {};
  studentStats.forEach(s=>{
    if(!classGroups[s.classLabel]) classGroups[s.classLabel] = [];
    classGroups[s.classLabel].push(s);
  });
  const classLabels = Object.keys(classGroups).sort((a,b)=>{
    const pa = classGroups[a][0], pb = classGroups[b][0];
    if(pa.grade !== pb.grade) return Number(pa.grade)-Number(pb.grade);
    return Number(pa.classNum)-Number(pb.classNum);
  });

  let bodyHtml = '';
  if(totalStudents===0){
    bodyHtml = `<div class="empty-dash">아직 학습을 시작한 학생이 없습니다.</div>`;
  } else {
    classLabels.forEach(label=>{
      const list = classGroups[label];
      const agg = aggregate(list);
      bodyHtml += `
        <div class="class-group">
          <div class="class-group-head">
            <div class="class-group-title">${label}</div>
            <div class="class-group-stats">학생 ${agg.count}명 · 평균 점수 ${agg.avgScore===null?'-':agg.avgScore+'%'} · 평균 진행률 ${agg.avgProgress}% · 전체 완료 ${agg.fullyDone}명</div>
          </div>
          <div class="student-list">`;
      list.forEach(s=>{
        const detailRows = DASH_THEME_DEFS.map(td=>{
          const info = s.themeInfo[td.key];
          const scoreText = info.scorePct===null ? '-' : `${info.scorePct}%`;
          const cls = info.completed ? 'good' : (info.progressPct>0 ? 'na' : 'bad');
          return `
            <div class="detail-row">
              <span class="dt-title">${td.label}</span>
              <span class="dt-mid">${info.progressPct}% 진행</span>
              <span class="dt-mid">점수 ${scoreText}</span>
              <span class="dt-score ${cls}">${info.timeLabel}</span>
            </div>`;
        }).join('');
        bodyHtml += `
          <details class="student-row">
            <summary>
              <span class="sid">${s.number}번</span>
              <span class="sname">${s.name}</span>
              <span class="sprog">진행률 ${s.overallProgress}%</span>
              <span class="savg">${s.overallScore===null?'-':s.overallScore+'%'}</span>
            </summary>
            <div class="student-detail">${detailRows}</div>
          </details>`;
      });
      bodyHtml += `</div></div>`;
    });
  }

  panelEl.innerHTML = `
    <div class="dash-top">
      <h2>학생 학습 현황</h2>
      <div class="dash-actions">
        <button class="icon-btn" id="dashRefreshBtn">새로고침</button>
      </div>
    </div>
    ${!hasStorage ? `<div class="storage-warning">⚠ Firebase 저장소 연결에 실패했습니다. 인터넷 연결을 확인하거나, 잠시 후 새로고침해 주세요.</div>` : ''}
    <div class="stat-cards">
      <div class="stat-card"><div class="n">${totalStudents}</div><div class="l">참여 학생 수</div></div>
      <div class="stat-card"><div class="n">${overallAgg.avgScore===null?'-':overallAgg.avgScore+'%'}</div><div class="l">전체 평균 점수</div></div>
      <div class="stat-card"><div class="n">${overallAgg.avgProgress}%</div><div class="l">전체 평균 진행률</div></div>
    </div>
    ${bodyHtml}
  `;

  document.getElementById('dashRefreshBtn').addEventListener('click', ()=>{
    renderDashboardLoading();
    loadDashboardData();
  });
}

/* =========================================================
   TABLE OF CONTENTS (topic list)
========================================================= */
function renderTOC(){
  const doneCount = Object.keys(results).length;
  const totalCount = topics.length;
  let avgText = "-";
  if(doneCount>0){
    const totalScore = Object.values(results).reduce((a,r)=>a+r.score,0);
    const totalQ = Object.values(results).reduce((a,r)=>a+r.total,0);
    avgText = Math.round((totalScore/totalQ)*100) + "%";
  }

  let html = `
    <div class="toc-summary">
      <div>완료한 주제: <b>${doneCount}</b> / ${totalCount}</div>
      <div>평균 정답률: <span class="big">${avgText}</span></div>
    </div>
  `;

  groupedOrder.forEach(group=>{
    html += `<div class="unit-head"><span class="n">Ⅰ</span>${group}</div>`;
    topics.forEach((t,i)=>{
      if(t.group!==group) return;
      const r = results[i];
      const badge = r
        ? `<span class="badge done">${r.score}/${r.total}</span>`
        : `<span class="badge todo">${t.questions.length}문항</span>`;
      html += `
        <div class="topic-item" data-idx="${i}">
          <div class="idx">${t.unit}</div>
          <div class="info">
            <div class="t">${t.title}</div>
            <div class="p">${t.pages}</div>
          </div>
          ${badge}
          <div class="arrow">›</div>
        </div>
      `;
    });
  });

  panelEl.innerHTML = html;
  panelEl.querySelectorAll('.topic-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentTopicIdx = Number(el.dataset.idx);
      if(!userAnswers[currentTopicIdx]){
        userAnswers[currentTopicIdx] = new Array(topics[currentTopicIdx].questions.length).fill(null);
      }
      render();
    });
  });
}

/* =========================================================
   QUIZ VIEW
========================================================= */
function renderQuiz(idx){
  const topic = topics[idx];
  const answers = userAnswers[idx];
  const graded = !!results[idx];
  const answeredCount = answers.filter(a=>a!==null).length;
  const allAnswered = answeredCount === answers.length;

  let qHtml = topic.questions.map((q,qi)=>{
    const userAns = answers[qi];
    let stateClass = '';
    let resultTag = '';
    if(graded){
      const isCorrect = userAns === q.answer;
      stateClass = isCorrect ? 'correct' : 'incorrect';
      resultTag = isCorrect
        ? `<div class="result-tag correct">정답</div>`
        : `<div class="result-tag incorrect">오답 · 정답은 ${q.answer ? 'O' : 'X'}</div>`;
    }
    return `
      <div class="question ${graded?'graded':''} ${stateClass}" data-qi="${qi}">
        <div class="q-row">
          <div class="q-num">${qi+1}.</div>
          <div class="q-text">${q.text}</div>
        </div>
        <div class="q-controls">
          <button class="ox-btn o-btn ${userAns===true?'selected':''}" data-val="true">O</button>
          <button class="ox-btn x-btn ${userAns===false?'selected':''}" data-val="false">X</button>
        </div>
        ${resultTag}
        <div class="explain"><span class="lbl">해설.</span>${q.explain}</div>
      </div>
    `;
  }).join('');

  let scoreHtml = '';
  if(graded){
    const r = results[idx];
    const pct = Math.round((r.score/r.total)*100);
    let msg = '';
    if(pct===100) msg = "완벽해요! 모든 내용을 정확히 이해했습니다.";
    else if(pct>=80) msg = "아주 잘했어요! 조금만 더 점검하면 완벽해요.";
    else if(pct>=60) msg = "틀린 문항의 해설을 꼭 다시 읽어보세요.";
    else msg = "이 주제는 교과서를 다시 한번 확인해 보세요.";
    scoreHtml = `
      <div class="score-wrap">
        <div class="stamp">
          <div class="score-num">${pct}</div>
          <div class="score-den">점 / ${r.score} · ${r.total}</div>
        </div>
        <div class="score-msg">${msg}</div>
      </div>
    `;
  }

  panelEl.innerHTML = `
    <div class="quiz-head">
      <div class="back" id="backBtn">‹ 목차로 돌아가기</div>
      <div class="eyebrow">${topic.unit}</div>
      <h2>${topic.title}</h2>
      <div class="pages">${topic.pages}</div>
    </div>
    ${scoreHtml}
    ${!graded ? `
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${(answeredCount/answers.length)*100}%"></div></div>
      <div class="progress-label">${answeredCount} / ${answers.length} 답변</div>
    </div>` : ''}
    <div class="questions">${qHtml}</div>
    <div class="action-row">
      ${!graded ? `<button class="btn" id="gradeBtn" ${allAnswered?'':'disabled'}>채점하기</button>` : `<button class="btn" id="retryBtn">다시 풀기</button>`}
      <button class="btn ghost" id="tocBtn">목차로</button>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', ()=>{ currentTopicIdx=null; render(); });
  document.getElementById('tocBtn').addEventListener('click', ()=>{ currentTopicIdx=null; render(); });

  if(!graded){
    panelEl.querySelectorAll('.ox-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const qEl = btn.closest('.question');
        const qi = Number(qEl.dataset.qi);
        const val = btn.dataset.val === 'true';
        answers[qi] = val;
        syncProgressToStorage(idx);
        renderQuiz(idx); // re-render to update selection + progress
      });
    });
    const gradeBtn = document.getElementById('gradeBtn');
    if(gradeBtn){
      gradeBtn.addEventListener('click', ()=>{
        let score = 0;
        topic.questions.forEach((q,qi)=>{ if(answers[qi]===q.answer) score++; });
        results[idx] = {score, total: topic.questions.length};
        syncProgressToStorage(idx);
        renderQuiz(idx);
      });
    }
  } else {
    const retryBtn = document.getElementById('retryBtn');
    retryBtn.addEventListener('click', ()=>{
      delete results[idx];
      userAnswers[idx] = new Array(topic.questions.length).fill(null);
      if(session && session.role==='student' && studentRecord && studentRecord.progress){
        delete studentRecord.progress[idx];
        saveStudentRecord(studentRecord);
      }
      renderQuiz(idx);
    });
  }
}

/* init: wait at login overlay until a role is submitted */
</script>
